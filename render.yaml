services:
  - type: web
    name: telegram-game-platform
    runtime: node
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate:prod && npm run db:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false          # Set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-game-platform-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_URL
        sync: false          # Set to https://<your-render-url> after first deploy
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: WEBAPP_BASE_URL
        sync: false

databases:
  - name: telegram-game-platform-db
    databaseName: gameplatform
    plan: free